apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId 'cn.mu5120.console'
        minSdkVersion 23
        targetSdkVersion 30
        versionCode 69
        versionName '1.3.55'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    signingConfigs {
        release {
            storeFile file('../mu5120-release.jks')
            storePassword 'MU5120-111111'
            keyAlias 'mu5120'
            keyPassword 'MU5120-111111'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    sourceSets.main.assets.srcDir "$buildDir/generated/monitorAssets"
}

// Both runtimes consume one field inventory, including after boot without a WebView.
task prepareMonitorAssets(type: Copy) {
    from '../../src/services/router-fields.json'
    into "$buildDir/generated/monitorAssets"
}
preBuild.dependsOn prepareMonitorAssets
