apply plugin: 'com.android.application'

def batteryProfile = new groovy.json.JsonSlurper().parse(file('../../config/battery-profile.json')).mode
if (!(batteryProfile in ['factory', 'gauge88-csv'])) throw new GradleException('Invalid battery profile')

android {
    compileSdkVersion 30
    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId 'cn.mu5120.console'
        minSdkVersion 23
        targetSdkVersion 30
        versionCode 77
        versionName '1.4.5'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        buildConfigField 'String', 'BATTERY_PROFILE', '"' + batteryProfile + '"'
    }

    signingConfigs {
        release {
            storeFile file('../mu5120-release.jks')
            storePassword 'MU5120-111111'
            keyAlias 'mu5120'
            keyPassword 'MU5120-111111'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    // Never package a legacy source-tree H5 bundle: generate from the selected profile.
    sourceSets.main.assets.srcDirs = ["$buildDir/generated/monitorAssets", "$buildDir/generated/webAssets"]
}

// Both runtimes consume one field inventory, including after boot without a WebView.
task prepareMonitorAssets(type: Copy) {
    from '../../src/services/router-fields.json'
    into "$buildDir/generated/monitorAssets"
}
preBuild.dependsOn prepareMonitorAssets

task buildMonitorWeb(type: Exec) {
    workingDir '../..'
    commandLine 'node', 'android-wrapper/build-web-assets.mjs'
}
task prepareWebAssets(type: Sync, dependsOn: buildMonitorWeb) {
    from '../../dist/build/h5'
    into "$buildDir/generated/webAssets/www"
}
preBuild.dependsOn prepareWebAssets
